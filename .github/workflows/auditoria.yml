name: Auditoria Precios Janis-MELI

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Registros a procesar (0 = todos; ej: 30 = prueba rápida)'
        required: false
        default: '0'

jobs:
  ejecutar-auditoria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm install

      - name: Correr auditoria Janis
        env:
          JANIS_API_KEY: ${{ secrets.JANIS_API_KEY }}
          JANIS_API_SECRET: ${{ secrets.JANIS_API_SECRET }}
          JANIS_CLIENT: ${{ secrets.JANIS_CLIENT }}
          VTEX_ACCOUNT: ${{ secrets.VTEX_ACCOUNT }}
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: node auditoria-janis-meli.mjs

      - name: Subir resultados como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: resultados-auditoria
          path: |
            meli0002-completo.xlsx
            meli0002-desfasados.xlsx
            meli0002-pegados.xlsx
          if-no-files-found: warn

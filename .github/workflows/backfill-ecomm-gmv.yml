name: Backfill GMV total ecommerce

# Se auto-dispara al mergear/cambiar este archivo en main. Rellena total_ecomm_gmv
# en los JSON diarios existentes (solo lista de VTEX, sin re-fetchear detalles).
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-ecomm-gmv.yml"
  workflow_dispatch:
    inputs:
      date_from:
        description: "Desde (YYYY-MM-DD)"
        required: false
        default: "2026-05-01"

concurrency:
  group: backfill-ecomm-gmv
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install axios

      - name: Backfill total_ecomm_gmv
        env:
          VTEX_APP_KEY:   ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_ACCOUNT:   ${{ secrets.VTEX_ACCOUNT }}
          DATE_FROM:      ${{ github.event.inputs.date_from || '2026-05-01' }}
        run: node backfill-ecomm-gmv.js

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/daily/
          git diff --staged --quiet || git commit -m "backfill: total_ecomm_gmv en históricos (participación \$)" -q
          for i in 1 2 3 4; do
            if git push; then break; fi
            echo "push falló, reintento..."; sleep $((i*5)); git pull --rebase --autostash || true
          done

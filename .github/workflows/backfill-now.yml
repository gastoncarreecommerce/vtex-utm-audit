name: Backfill Now (one-shot)

# Se dispara automáticamente al cambiar este archivo (push a main),
# así no depende del botón "Run workflow". Reescribe los rows con los
# campos nuevos (items + utm_campaign + coupon) para todo el histórico.
# Re-run 3: arreglar hora 24h (formatFechaAR) + coupon. Reescribe todo el histórico.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-now.yml"
  workflow_dispatch:

# cancel-in-progress: true → este run cancela cualquier backfill anterior en curso
concurrency:
  group: backfill-now
  cancel-in-progress: true

# Donde fetch-orders.js escribe los rows con PII (repo privado, no este).
env:
  ROWS_DIR: private-data/daily

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      # Los rows llevan el email del cliente y este repo es PUBLICO, asi que se
      # escriben en el checkout del repo privado (via ROWS_DIR) y se pushean alla.
      - name: Checkout repo privado de datos
        uses: actions/checkout@v4
        with:
          repository: gastoncarreecommerce/appdash-private-data
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private-data

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install googleapis axios

      - name: Backfill mayo 1 → junio 10
        env:
          VTEX_APP_KEY:   ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_ACCOUNT:   ${{ secrets.VTEX_ACCOUNT }}
        run: |
          start="2026-05-01"
          end="2026-06-10"
          current="$start"
          while [[ "$current" < "$end" ]] || [[ "$current" == "$end" ]]; do
            echo "▶ Processing $current..."
            node fetch-orders.js "$current" || echo "⚠ Error en $current, continuando..."
            current=$(date -d "$current + 1 day" +%Y-%m-%d)
            # Commit incremental para no perder progreso si algo falla
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/data/
            git diff --staged --quiet || git commit -m "backfill 24h+coupon: $current" -q
          done

      - name: Push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "backfill items+cupones: 2026-05-01 → 2026-06-10" -q
          for i in 1 2 3 4; do
            if git push; then break; fi
            echo "push falló, reintento en ${i}0s..."; sleep ${i}0
            git pull --rebase --autostash || true
          done

      - name: Commit rows con PII al repo privado
        working-directory: private-data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily/
          if git diff --staged --quiet; then
            echo "Sin rows nuevos."
          else
            git commit -m "rows: $(date -u +%Y-%m-%d)" -q
            for i in 1 2 3 4; do
              if git push; then break; fi
              echo "push falló, reintento..."; sleep $((i*5)); git pull --rebase --autostash || true
            done
          fi

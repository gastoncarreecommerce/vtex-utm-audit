name: Backfill Web Recompra (Julio)

# Trae Recompra / Frecuencia / Basket size de WEB (pedidos que NO son de la
# app) para julio 2026 completo, para poder compararlo contra la app.
# Se auto-dispara al pushear/cambiar este archivo. Puede tardar 1-3 horas
# (~92.500 pedidos de detalle) — por eso corre en background como Action.
# Salida: docs/data/web-recompra/2026-07-01_2026-07-31.json (solo agregados).
on:
  push:
    paths:
      - ".github/workflows/backfill-web-recompra.yml"
  workflow_dispatch:
    inputs:
      from:
        description: "Fecha inicio (YYYY-MM-DD)"
        required: false
        default: "2026-07-01"
      to:
        description: "Fecha fin (YYYY-MM-DD)"
        required: false
        default: "2026-07-31"

concurrency:
  group: backfill-web-recompra
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install axios

      - name: Fetch Web recompra/frecuencia/basket
        env:
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_ACCOUNT: ${{ secrets.VTEX_ACCOUNT }}
        run: |
          FROM="${{ github.event.inputs.from }}"
          TO="${{ github.event.inputs.to }}"
          FROM="${FROM:-2026-07-01}"
          TO="${TO:-2026-07-31}"
          SOURCE_DATE="$(date -u +%Y-%m-%dT%H:%M:%S%:z)" node scripts/fetch-web-recompra.mjs "$FROM" "$TO"

      - name: Commit resultado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/web-recompra/
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "web-recompra: backfill" -q
            for i in 1 2 3 4; do
              if git push; then break; fi
              echo "push falló, reintento..."; sleep $((i*5)); git pull --rebase --autostash || true
            done
          fi

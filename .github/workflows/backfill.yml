name: Backfill Historical Data

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "Fecha inicio (YYYY-MM-DD)"
        required: true
        default: "2026-05-01"
      date_to:
        description: "Fecha fin (YYYY-MM-DD)"
        required: true
        default: "2026-06-07"

# Donde fetch-orders.js escribe los rows con PII (repo privado, no este).
env:
  ROWS_DIR: private-data/daily

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      # Los rows llevan el email del cliente y este repo es PUBLICO, asi que se
      # escriben en el checkout del repo privado (via ROWS_DIR) y se pushean alla.
      - name: Checkout repo privado de datos
        uses: actions/checkout@v4
        with:
          repository: gastoncarreecommerce/appdash-private-data
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private-data

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install googleapis axios

      - name: Backfill dates
        env:
          VTEX_APP_KEY:   ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_ACCOUNT:   ${{ secrets.VTEX_ACCOUNT }}
        run: |
          start="${{ github.event.inputs.date_from }}"
          end="${{ github.event.inputs.date_to }}"
          current="$start"
          while [[ "$current" < "$end" ]] || [[ "$current" == "$end" ]]; do
            echo "▶ Processing $current..."
            node fetch-orders.js "$current" || echo "⚠ Error en $current, continuando..."
            current=$(date -d "$current + 1 day" +%Y-%m-%d 2>/dev/null || date -v+1d -j -f "%Y-%m-%d" "$current" +%Y-%m-%d)
          done

      - name: Commit all data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "backfill: ${{ github.event.inputs.date_from }} → ${{ github.event.inputs.date_to }}"
          git push

      - name: Commit rows con PII al repo privado
        working-directory: private-data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily/
          if git diff --staged --quiet; then
            echo "Sin rows nuevos."
          else
            git commit -m "rows: $(date -u +%Y-%m-%d)" -q
            for i in 1 2 3 4; do
              if git push; then break; fi
              echo "push falló, reintento..."; sleep $((i*5)); git pull --rebase --autostash || true
            done
          fi

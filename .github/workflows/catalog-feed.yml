name: Generar catálogo para Einstein Recommendations

# Por ahora, solo manual: lo corrés vos desde la pestaña "Actions" en GitHub
# con el botón "Run workflow". Más adelante, cuando esto funcione bien,
# se puede sumar un "schedule:" para que corra solo todos los días.
on:
  workflow_dispatch:
    inputs:
      max_products:
        description: "Escribí un número para probar rápido, o dejá 'all' para todo el catálogo"
        required: false
        default: "all"
      list_sellers_only:
        description: "Poné 'true' para solo listar los sellers de la cuenta (no genera el catálogo)"
        required: false
        default: "false"
      concurrency:
        description: "Cuántos productos pedir en paralelo (subir para catálogo completo, ej: 15)"
        required: false
        default: "5"
      batch_delay_ms:
        description: "Pausa entre tandas en milisegundos (bajar para catálogo completo, ej: 150)"
        required: false
        default: "200"

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 340 # el catálogo completo tarda ~1-1.5hs; dejamos margen bajo el límite de 6hs de GitHub
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar el archivo del catálogo
        working-directory: vtex-to-sfmc-feed
        env:
          VTEX_ACCOUNT: ${{ secrets.VTEX_ACCOUNT }}
          VTEX_APP_KEY: ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          FEED_MAX_PRODUCTS: ${{ github.event.inputs.max_products }}
          LIST_SELLERS_ONLY: ${{ github.event.inputs.list_sellers_only }}
          FEED_CONCURRENCY: ${{ github.event.inputs.concurrency }}
          FEED_BATCH_DELAY_MS: ${{ github.event.inputs.batch_delay_ms }}
        run: node build-catalog-feed.js

      # Subimos el archivo como "artifact" del workflow, no lo pusheamos al repo.
      # Se descarga manualmente desde la pantalla del run, en GitHub -> Actions.
      - name: Subir el catálogo como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-einstein
          path: vtex-to-sfmc-feed/output/catalog.psv
          retention-days: 7

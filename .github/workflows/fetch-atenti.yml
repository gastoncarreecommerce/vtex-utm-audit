name: Fetch Atenti (logs chat IA)

# fetch-atenti.js pide los logs vía el Apps Script propio (apps-script/atenti-logs.gs),
# no vía Gmail/OAuth directo: evita el refresh token de Google, que en un
# proyecto OAuth en modo "Testing" vence a los 7 días de inactividad (eso fue
# lo que rompió el módulo entre el 11 y el 31 de agosto tras un intento previo
# de volver a Gmail). Necesita 2 secrets en el repo: APPSCRIPT_URL y
# APPSCRIPT_SECRET (instrucciones de deploy en apps-script/atenti-logs.gs).
# APPSCRIPT_URL/APPSCRIPT_SECRET cargados el 2026-08-31, desplegado desde una
# cuenta personal (no Workspace) para poder usar acceso "Cualquier persona".
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-atenti.yml"
  schedule:
    - cron: "20 4 * * *"   # 4:20 UTC = 1:20am AR — el mail llega a la 1am en punto
  workflow_dispatch:
    inputs:
      date:
        description: "Backfill: una fecha (YYYY-MM-DD) o varias separadas por coma. Vacío = último mail disponible."
        required: false

concurrency:
  group: fetch-atenti
  cancel-in-progress: false

jobs:
  fetch-atenti:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Atenti logs
        env:
          APPSCRIPT_URL:     ${{ secrets.APPSCRIPT_URL }}
          APPSCRIPT_SECRET:  ${{ secrets.APPSCRIPT_SECRET }}
          FETCH_ATENTI_DATE: ${{ github.event.inputs.date }}
        run: node fetch-atenti.js

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/atenti/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "atenti: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            if git push; then break; fi
            echo "push falló, reintento..."; sleep ${i}0
            git pull --rebase --autostash || true
          done

name: Fetch Daily Orders

on:
  schedule:
    - cron: "0 6 * * *"   # 6am UTC = 3am Argentina (día ya cerrado)
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha a procesar (YYYY-MM-DD). Vacío = ayer"
        required: false
        default: ""

# Donde fetch-orders.js escribe los rows con PII (repo privado, no este).
env:
  ROWS_DIR: private-data/daily

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      # Los rows llevan el email del cliente y este repo es PUBLICO, asi que se
      # escriben en el checkout del repo privado (via ROWS_DIR) y se pushean alla.
      - name: Checkout repo privado de datos
        uses: actions/checkout@v4
        with:
          repository: gastoncarreecommerce/appdash-private-data
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private-data

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install googleapis axios

      - name: Fetch orders
        env:
          VTEX_APP_KEY:   ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_ACCOUNT:   ${{ secrets.VTEX_ACCOUNT }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            node fetch-orders.js ${{ github.event.inputs.date }}
          else
            node fetch-orders.js
          fi

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push

      - name: Commit rows con PII al repo privado
        working-directory: private-data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily/
          if git diff --staged --quiet; then
            echo "Sin rows nuevos."
          else
            git commit -m "rows: $(date -u +%Y-%m-%d)" -q
            for i in 1 2 3 4; do
              if git push; then break; fi
              echo "push falló, reintento..."; sleep $((i*5)); git pull --rebase --autostash || true
            done
          fi

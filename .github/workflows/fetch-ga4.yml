name: Fetch GA4 (Compra Online)

on:
  # Push a este archivo → trae el día de HOY ya mismo (refresco manual inmediato)
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-ga4.yml"
  schedule:
    # Cada 3 horas en vez de cada hora: el ritmo real medido ya era de 7,5
    # corridas/día (hueco mediano 177 min) porque GitHub descartaba el resto,
    # así que 8/día no cambia el comportamiento — solo lo vuelve predecible
    # para la cuota de Actions del repo privado.
    - cron: "5 */3 * * *"    # cada hora: refresca el día de HOY (datos intraday de GA4)
    - cron: "30 6 * * *"   # 6:30 UTC = 3:30am AR: consolida el día de AYER ya completo
  workflow_dispatch:
    inputs:
      date_from:
        description: "Fecha inicio (YYYY-MM-DD). Vacío = hoy"
        required: false
        default: ""
      date_to:
        description: "Fecha fin (YYYY-MM-DD). Vacío = igual a inicio"
        required: false
        default: ""

concurrency:
  group: fetch-ga4
  cancel-in-progress: false

jobs:
  fetch-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install googleapis

      - name: Fetch GA4 events
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GA4_PROPERTY_ID:        ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          start="${{ github.event.inputs.date_from }}"
          end="${{ github.event.inputs.date_to }}"
          today=$(date -u -d "-3 hours" +%Y-%m-%d)   # hoy en hora Argentina (UTC-3)
          if [ -n "$start" ]; then
            # Rango manual (backfill): date_from → date_to
            [ -z "$end" ] && end="$start"
            current="$start"
            while [[ "$current" < "$end" ]] || [[ "$current" == "$end" ]]; do
              node fetch-ga4.js "$current" || echo "⚠ Error en $current, continuando..."
              current=$(date -d "$current + 1 day" +%Y-%m-%d)
            done
          elif [ "${{ github.event.schedule }}" = "30 6 * * *" ]; then
            # Cron diario: ayer ya completo (default de fetch-ga4.js)
            node fetch-ga4.js
          else
            # Push, cron horario o dispatch sin inputs → HOY (intraday)
            node fetch-ga4.js "$today"
          fi

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ga4/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "ga4: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            if git push; then break; fi
            echo "push falló, reintento..."; sleep ${i}0
            git pull --rebase --autostash || true
          done

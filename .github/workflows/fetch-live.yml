name: Fetch Live (Hoy)

on:
  schedule:
    # Cada hora, no cada 5 min. Dos razones:
    #
    # 1) El */5 nunca pasó: GitHub descarta las corridas programadas de alta
    #    frecuencia en repos públicos, y la mediana real entre corridas era de
    #    211 min (42x el intervalo declarado). Cada hora es MÁS frecuente que
    #    lo que venía ocurriendo, además de predecible.
    # 2) Con el repo en privado los minutos se cuentan contra la cuota (2.000/mes
    #    en plan Free). Al */5 honrado serían 288 runs/día = 12.096 min/mes, 6x
    #    la cuota. Cada hora son ~1.008 min/mes y entra con margen.
    #
    # Esto no atrasa el dato en vivo: el dashboard lo trae de /api/today con
    # `since`, y este workflow solo pre-cachea el snapshot para que el primer
    # usuario no pague el fetch del día completo.
    - cron: "0 * * * *"
  workflow_dispatch:

# Evita que dos corridas se pisen: si arranca una nueva, cancela la anterior en curso
concurrency:
  group: fetch-live
  cancel-in-progress: true

# Donde fetch-orders.js escribe los rows con PII (repo privado, no este).
env:
  ROWS_DIR: private-data/daily

jobs:
  fetch-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      # Los rows llevan el email del cliente y este repo es PUBLICO, asi que se
      # escriben en el checkout del repo privado (via ROWS_DIR) y se pushean alla.
      - name: Checkout repo privado de datos
        uses: actions/checkout@v4
        with:
          repository: gastoncarreecommerce/appdash-private-data
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private-data

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install googleapis axios

      - name: Fetch today (Argentina time = UTC-3)
        env:
          VTEX_APP_KEY:   ${{ secrets.VTEX_APP_KEY }}
          VTEX_APP_TOKEN: ${{ secrets.VTEX_APP_TOKEN }}
          VTEX_ACCOUNT:   ${{ secrets.VTEX_ACCOUNT }}
        run: |
          TODAY=$(date -u --date='3 hours ago' +%Y-%m-%d)
          echo "▶ Fetching live data for: $TODAY"
          node fetch-orders.js "$TODAY"

      - name: Commit live data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "live: $(date -u +%Y-%m-%dT%H:%M)Z"
          git push

      - name: Commit rows con PII al repo privado
        working-directory: private-data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily/
          if git diff --staged --quiet; then
            echo "Sin rows nuevos."
          else
            git commit -m "rows: $(date -u +%Y-%m-%d)" -q
            ok=0
            for i in 1 2 3 4; do
              if git push; then ok=1; break; fi
              echo "push falló, reintento..."; sleep $((i*5)); git pull --rebase --autostash || true
            done
            # Sin esto el step salia 0 aunque los 4 intentos fallaran: el push se
            # perdia en silencio y el workflow se pintaba verde. Los rows de esta
            # corrida solo existen en el runner, asi que fallar es obligatorio.
            if [ "$ok" != 1 ]; then
              echo "::error::No se pudieron pushear los rows al repo privado tras 4 intentos. Revisar que PRIVATE_DATA_TOKEN tenga Contents: Read and write."
              exit 1
            fi
          fi
